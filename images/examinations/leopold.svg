<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600"><rect width="900" height="600" fill="#f8fafc"/><text x="40" y="50" font-family="Arial" font-size="30" font-weight="700">Leopold Maneuvers — 4 Grips</text><ellipse cx="450" cy="330" rx="150" ry="220" fill="#fde2e2" stroke="#475569" stroke-width="4"/><circle cx="450" cy="165" r="38" fill="#cbd5e1" stroke="#475569" stroke-width="4"/><text x="80" y="130" font-family="Arial" font-size="22" font-weight="700">1. Fundal grip</text><text x="80" y="160" font-family="Arial" font-size="18">Identify fetal pole in fundus</text><text x="620" y="220" font-family="Arial" font-size="22" font-weight="700">2. Lateral grip</text><text x="620" y="250" font-family="Arial" font-size="18">Locate fetal back / small parts</text><text x="80" y="420" font-family="Arial" font-size="22" font-weight="700">3. Pawlik grip</text><text x="80" y="450" font-family="Arial" font-size="18">Identify presenting part</text><text x="620" y="450" font-family="Arial" font-size="22" font-weight="700">4. Pelvic grip</text><text x="620" y="480" font-family="Arial" font-size="18">Assess descent and flexion</text><path d="M450 90 L450 40 M300 330 L180 330 M600 330 L720 330 M450 550 L450 580" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/></svg>
name: Load Disease Reference v5

on:
  push:
    paths:
      - 'disease-content-v5-additions.js'
      - '.github/workflows/load-disease-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  load-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add v5 disease loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="sc4.src='disease-content-v4-additions.js';sc4.onload=cb;document.head.appendChild(sc4)"
          new="sc4.src='disease-content-v4-additions.js';sc4.onload=function(){var sc5=document.createElement('script');sc5.src='disease-content-v5-additions.js';sc5.onload=cb;document.head.appendChild(sc5)};document.head.appendChild(sc4)"
          if old in s:
              s=s.replace(old,new,1)
          else:
              print('v5 loader already present or expected loader not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Load v5 disease reference modules'; git push; fi

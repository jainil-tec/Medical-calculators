name: Load Disease Reference v5

on:
  push:
    paths:
      - 'disease-content-v5-additions.js'
      - '.github/workflows/load-disease-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  load-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add reliable v5 disease script tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="disease-content-v5-additions.js"></script>'
          if tag not in s:
              marker = '</head>'
              if marker in s:
                  s = s.replace(marker, tag + marker, 1)
              else:
                  s += '\n' + tag + '\n'
              p.write_text(s, encoding='utf-8')
              print('Added v5 disease script tag')
          else:
              print('v5 disease script tag already present')
          PY
      - name: Commit homepage change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage change required'
          else
            git commit -m 'Load all v5 disease modules on homepage'
            git push
          fi

name: Load Disease Reference v5

on:
  push:
    paths:
      - 'disease-content-v5-additions.js'
      - '.github/workflows/load-disease-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  load-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update disease reference card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          tag = '<script src="disease-content-v5-additions.js"></script>'
          if tag not in s:
              marker = '</head>'
              if marker in s:
                  s = s.replace(marker, tag + marker, 1)
              else:
                  s += '\n' + tag + '\n'

          marker = '<!-- MEDCALC_DISEASE_SUMMARY_CARD_V1 -->'
          if marker not in s:
              patch = r'''<!-- MEDCALC_DISEASE_SUMMARY_CARD_V1 -->
          <style>
          .mcDiseaseSummaryCardV1{position:relative}
          .mcDiseaseSummaryCardV1 .mcDiseaseDescV1{font-size:13px;line-height:1.35;opacity:.72;margin-top:4px}
          .mcDiseaseSummaryCardV1 .mcDiseaseArrowV1{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:28px;opacity:.72}
          </style>
          <script>
          (function(){
            function patch(){
              var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
              var free=null,noReg=null,n;
              while(n=walker.nextNode()){
                var t=n.nodeValue.trim();
                if(t==='Free' && !free) free=n;
                if(t==='No registration' && !noReg) noReg=n;
              }
              if(!free || !noReg) return false;
              var card=free.parentElement;
              for(var i=0;i<6 && card;i++,card=card.parentElement){
                if(card.textContent.indexOf('Free')>=0 && card.textContent.indexOf('No registration')>=0) break;
              }
              if(!card) return false;
              card.classList.add('mcDiseaseSummaryCardV1');
              free.nodeValue='30+';
              noReg.nodeValue='Diseases & Treatment';
              if(!card.querySelector('.mcDiseaseDescV1')){
                var d=document.createElement('div');
                d.className='mcDiseaseDescV1';
                d.textContent='Clinical features • Diagnosis • Investigations • Treatment';
                noReg.parentElement.appendChild(d);
              }
              if(!card.querySelector('.mcDiseaseArrowV1')){
                var a=document.createElement('span');
                a.className='mcDiseaseArrowV1';
                a.textContent='›';
                card.appendChild(a);
              }
              return true;
            }
            function run(){if(patch())return;var tries=0,t=setInterval(function(){if(patch()||++tries>30)clearInterval(t)},250)}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
          })();
          </script>
          '''
              if '</body>' in s:
                  s = s.replace('</body>', patch + '\n</body>', 1)
              else:
                  s += '\n' + patch

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage change required'
          else
            git commit -m 'Show diseases and treatment on homepage'
            git push
          fi

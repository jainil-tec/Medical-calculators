name: Apply Sidebar UI Fix

on:
  push:
    branches: [main]
    paths:
      - 'sidebar-ui-fix.js'
      - '.github/workflows/apply-sidebar-ui-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject sidebar patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="sidebar-ui-fix.js"></script>'
          if tag not in s:
              marker='</head>'
              if marker not in s:
                  marker='</body>'
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s,encoding='utf-8')
              print('Sidebar patch injected')
          else:
              print('Sidebar patch already present')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Fix sidebar drug section layout'; git push; fi

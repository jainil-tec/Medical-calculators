name: Load Disease Reference v7

on:
  push:
    paths:
      - 'disease-content-v7-additions.js'
      - '.github/workflows/load-disease-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  load-v7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Inject disease reference loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="disease-content-v7-additions.js"></script>'
          if tag not in s:
              if '</head>' in s:
                  s = s.replace('</head>', tag + '</head>', 1)
              else:
                  s += '\n' + tag + '\n'
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage loader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage change required'
          else
            git commit -m 'Load disease reference v7'
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main && git push && exit 0
              git rebase --abort || true
              git reset --hard origin/main
              python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); tag='<script src="disease-content-v7-additions.js"></script>'
          if tag not in s:
              s=s.replace('</head>',tag+'</head>',1) if '</head>' in s else s+'\n'+tag+'\n'
              p.write_text(s,encoding='utf-8')
          PY
              git add index.html && git commit -m 'Load disease reference v7' || true
            done
            exit 1
          fi

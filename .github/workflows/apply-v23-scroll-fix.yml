name: Apply MedCalc V23 scroll fix

on:
  push:
    paths:
      - '.github/workflows/apply-v23-scroll-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'MEDCALC_V23_SCROLL_FIX'
          if marker in s:
              print('V23 scroll fix already present; nothing to do.')
              raise SystemExit(0)
          patch = r'''\n<style id="MEDCALC_V23_SCROLL_FIX">\n/* Mobile/desktop modal scrolling fix */\n#v23Ref{\n  overflow:hidden !important;\n  overscroll-behavior:contain;\n  touch-action:none;\n}\n#v23Ref .v23Panel{\n  height:min(94dvh,920px) !important;\n  max-height:calc(100dvh - 24px) !important;\n  overflow:hidden !important;\n}\n#v23Ref .v23Body{\n  display:flex !important;\n  flex:1 1 auto !important;\n  min-height:0 !important;\n  overflow:hidden !important;\n}\n#v23Ref .v23Nav{\n  flex:0 0 auto !important;\n  min-height:0 !important;\n  overscroll-behavior:contain;\n  touch-action:pan-x;\n}\n#v23Ref .v23Content{\n  flex:1 1 auto !important;\n  min-height:0 !important;\n  min-width:0 !important;\n  overflow-y:auto !important;\n  overflow-x:hidden !important;\n  -webkit-overflow-scrolling:touch !important;\n  overscroll-behavior-y:contain !important;\n  touch-action:pan-y !important;\n  scrollbar-width:thin;\n}\n#v23Ref .v23Section{padding-bottom:24px}\n@media(max-width:700px){\n  #v23Ref{padding:8px !important}\n  #v23Ref .v23Panel{\n    width:100% !important;\n    height:calc(100dvh - 16px) !important;\n    max-height:none !important;\n    border-radius:24px !important;\n  }\n  #v23Ref .v23Body{\n    display:flex !important;\n    flex-direction:column !important;\n  }\n  #v23Ref .v23Nav{\n    width:100% !important;\n    border-right:0 !important;\n    border-bottom:1px solid #e5e7eb !important;\n    display:flex !important;\n    flex:0 0 auto !important;\n    overflow-x:auto !important;\n    overflow-y:hidden !important;\n    -webkit-overflow-scrolling:touch !important;\n    touch-action:pan-x !important;\n    padding:10px !important;\n  }\n  #v23Ref .v23Nav button{flex:0 0 auto !important;min-width:max-content !important}\n  #v23Ref .v23Content{\n    display:block !important;\n    flex:1 1 auto !important;\n    width:100% !important;\n    height:auto !important;\n    min-height:0 !important;\n    overflow-y:auto !important;\n    overflow-x:hidden !important;\n    -webkit-overflow-scrolling:touch !important;\n    touch-action:pan-y !important;\n    padding:18px 14px 40px !important;\n  }\n}\n</style>\n<script id="MEDCALC_V23_SCROLL_FIX_JS">\n(()=> {\n  const modal=document.getElementById('v23Ref');\n  const content=document.getElementById('v23Content');\n  if(!modal||!content) return;\n  const stopBody=()=>document.documentElement.classList.add('v23-lock');\n  const unlockBody=()=>document.documentElement.classList.remove('v23-lock');\n  const oldOpen=window.openV23Emergency;\n  window.openV23Emergency=()=>{\n    if(oldOpen) oldOpen();\n    stopBody();\n    requestAnimationFrame(()=>{content.scrollTop=0});\n  };\n  document.getElementById('v23Close')?.addEventListener('click',unlockBody);\n  modal.addEventListener('click',e=>{if(e.target===modal)unlockBody()});\n  document.addEventListener('keydown',e=>{if(e.key==='Escape')unlockBody()});\n})();\n</script>\n<style id="MEDCALC_V23_SCROLL_LOCK">\nhtml.v23-lock,html.v23-lock body{overscroll-behavior:none}\n</style>\n'''
          s = s.replace('</body>', patch + '\n</body>')
          p.write_text(s, encoding='utf-8')
          print('V23 scroll fix appended.')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Fix mobile scrolling in V23 emergency algorithms'
            git push
          fi

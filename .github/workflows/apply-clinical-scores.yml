name: Load Clinical Scores Hub
on:
  push:
    branches: [main]
    paths:
      - 'clinical-scores-v1.js'
      - '.github/workflows/apply-clinical-scores.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject clinical scores loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="clinical-scores-v1.js"></script>'
          if tag not in s:
              marker='</head>' if '</head>' in s else '</body>'
              if marker not in s:
                  raise SystemExit('No HTML insertion point found')
              s=s.replace(marker,tag+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
              print('Injected clinical scores loader')
          else:
              print('Loader already present')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Add clinical scores hub to MedCalc'; git push; fi

name: Apply Detailed Examination Layer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply detailed physical examination data') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore stable clinical data and append detailed examinations
        run: |
          git checkout 032f87e0611afb8a9693f9c2ab055d0c2e79a216 -- clinical-content-v1.js
          cat examination-content-v3.js >> clinical-content-v1.js
      - name: Commit applied content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clinical-content-v1.js
          git commit -m 'Apply detailed physical examination data'
          git push

name: Apply Detailed Examination Layer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild clinical examination layer from current source files
        run: |
          cp clinical-content-v2-base.js clinical-content-v1.js
          printf '\n' >> clinical-content-v1.js
          cat examination-content-v3.js >> clinical-content-v1.js
          printf '\n' >> clinical-content-v1.js
          cat examination-media-v1.js >> clinical-content-v1.js
      - name: Commit rebuilt clinical layer if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clinical-content-v1.js
          if git diff --cached --quiet; then
            echo 'Clinical layer already matches current source files.'
            exit 0
          fi
          git commit -m 'Apply rebuilt clinical layer'
          git push

name: Load Disease Reference v6

on:
  push:
    paths:
      - 'disease-content-v6-additions.js'
      - '.github/workflows/load-disease-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  load-v6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject disease reference loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="disease-content-v6-additions.js"></script>'
          if tag not in s:
              if '</head>' in s:
                  s = s.replace('</head>', tag + '</head>', 1)
              else:
                  s += '\n' + tag + '\n'
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage loader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage change required'
          else
            git commit -m 'Load disease reference v6'
            git push
          fi

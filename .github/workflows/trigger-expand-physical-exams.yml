name: Trigger Expanded Physical Examinations

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ !contains(github.event.head_commit.message, 'Expand all physical examinations for revision') }}
    runs-on: ubuntu-latest
    steps:
      - name: Run examination expansion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Expand Physical Examinations" --ref main --repo "${{ github.repository }}"

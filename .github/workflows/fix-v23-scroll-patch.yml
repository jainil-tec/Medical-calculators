name: Repair MedCalc V23 scroll patch

on:
  push:
    paths:
      - '.github/workflows/fix-v23-scroll-patch.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken V23 patches with structural mobile scroll fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the old escaped/stacked V23 scroll patches completely.
          s = re.sub(
              r'<style id="MEDCALC_V23_SCROLL_FIX">.*?<style id="MEDCALC_V23_SCROLL_LOCK">.*?</style>\s*',
              '', s, flags=re.S
          )
          s = re.sub(
              r'<style id="MEDCALC_V23_SCROLL_FINAL">.*?</style>\s*<script id="MEDCALC_V23_SCROLL_FINAL_JS">.*?</script>\s*',
              '', s, flags=re.S
          )

          patch = '''
          <style id="MEDCALC_V23_SCROLL_FINAL">
          /* V23 structural scroll fix: modal owns the viewport; content owns vertical scrolling. */
          html.medcalc-modal-lock, html.medcalc-modal-lock body { overflow: hidden !important; height: 100% !important; }
          #v23Ref {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100dvh !important;
            max-height: none !important;
            overflow: hidden !important;
            overscroll-behavior: none !important;
          }
          #v23Ref .v23Panel {
            display: flex !important;
            flex-direction: column !important;
            width: min(1200px, 100%) !important;
            height: 100% !important;
            max-height: 100% !important;
            overflow: hidden !important;
          }
          #v23Ref .v23Body {
            display: flex !important;
            flex: 1 1 0 !important;
            min-height: 0 !important;
            overflow: hidden !important;
          }
          #v23Ref .v23Content {
            flex: 1 1 0 !important;
            min-width: 0 !important;
            min-height: 0 !important;
            height: 0 !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            -webkit-overflow-scrolling: touch !important;
            overscroll-behavior-y: contain !important;
            touch-action: pan-y !important;
          }
          @media (max-width: 700px) {
            #v23Ref { padding: 0 !important; }
            #v23Ref .v23Panel {
              width: 100% !important;
              height: 100% !important;
              max-height: 100% !important;
              border-radius: 0 !important;
            }
            #v23Ref .v23Body {
              flex-direction: column !important;
              min-height: 0 !important;
            }
            #v23Ref .v23Nav {
              flex: 0 0 auto !important;
              width: 100% !important;
              max-height: 92px !important;
              overflow-x: auto !important;
              overflow-y: hidden !important;
              -webkit-overflow-scrolling: touch !important;
              touch-action: pan-x !important;
            }
            #v23Ref .v23Content {
              flex: 1 1 0 !important;
              width: 100% !important;
              min-height: 1px !important;
              height: 0 !important;
              overflow-y: auto !important;
              overflow-x: hidden !important;
              -webkit-overflow-scrolling: touch !important;
              touch-action: pan-y !important;
              padding-bottom: 64px !important;
            }
          }
          </style>
          <script id="MEDCALC_V23_SCROLL_FINAL_JS">
          (function(){
            var modal = document.getElementById('v23Ref');
            if (!modal) return;
            var savedY = 0;
            var locked = false;
            function lockPage(){
              if (locked) return;
              locked = true;
              savedY = window.scrollY || window.pageYOffset || 0;
              document.documentElement.classList.add('medcalc-modal-lock');
              document.body.classList.add('medcalc-modal-lock');
              document.body.style.position = 'fixed';
              document.body.style.top = (-savedY) + 'px';
              document.body.style.left = '0';
              document.body.style.right = '0';
              document.body.style.width = '100%';
            }
            function unlockPage(){
              if (!locked) return;
              locked = false;
              document.documentElement.classList.remove('medcalc-modal-lock');
              document.body.classList.remove('medcalc-modal-lock');
              document.body.style.position = '';
              document.body.style.top = '';
              document.body.style.left = '';
              document.body.style.right = '';
              document.body.style.width = '';
              window.scrollTo(0, savedY);
            }
            var oldOpen = window.openV23Emergency;
            if (typeof oldOpen === 'function') {
              window.openV23Emergency = function(){
                oldOpen.apply(this, arguments);
                lockPage();
                var c = document.getElementById('v23Content');
                if (c) { c.scrollTop = 0; setTimeout(function(){ c.scrollTop = 0; }, 50); }
              };
            }
            var close = document.getElementById('v23Close');
            if (close) close.addEventListener('click', unlockPage, true);
            modal.addEventListener('click', function(e){
              if (e.target === modal) unlockPage();
            }, true);
            document.addEventListener('keydown', function(e){
              if (e.key === 'Escape') unlockPage();
            }, true);
            var observer = new MutationObserver(function(){
              var cs = getComputedStyle(modal);
              var visible = cs.display !== 'none' && cs.visibility !== 'hidden';
              if (!visible) unlockPage();
            });
            observer.observe(modal, {attributes:true, attributeFilter:['style','class','hidden']});
          })();
          </script>
          '''
          # Remove indentation introduced by the YAML/Python block.
          patch = '\n'.join(line[10:] if line.startswith('          ') else line for line in patch.splitlines()) + '\n'
          marker = 'MEDCALC_V23_SCROLL_FINAL'
          if marker not in s:
              s = s.replace('</body>', patch + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repaired index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Fix V23 emergency modal scrolling'
            git push
          fi

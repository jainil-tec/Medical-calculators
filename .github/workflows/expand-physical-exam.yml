name: Expand Physical Examination
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add detailed examination data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('clinical-content-v1.js')
          s=p.read_text()
          marker='\n};'
          extra=r'''

/* Expanded physical examination reference */
window.MEDCALC_CLINICAL_CONTENT.examinations.groups = [
{name:'General Examination',items:['Introduce yourself, confirm identity, explain examination, obtain consent and ensure privacy.','Assess general appearance, consciousness, distress, posture, nutrition and hydration.','Record pulse, blood pressure, respiratory rate, temperature and SpO2 as appropriate.','Look for pallor, icterus, cyanosis, clubbing, lymphadenopathy and edema.','Examine hands, nails, face, eyes, mouth, neck and skin for relevant systemic signs.','Complete the focused systemic examination and summarize important positive and negative findings.']},
{name:'Cardiovascular Examination',items:['Position patient appropriately and expose the precordium with privacy.','Inspect for cyanosis, scars, deformity and visible pulsations.','Assess pulse: rate, rhythm, volume and character; compare relevant pulses.','Measure blood pressure and assess peripheral perfusion.','Assess JVP and peripheral edema.','Palpate apex beat, heaves and thrills.','Auscultate S1, S2, splitting, added sounds and murmurs systematically.','Use appropriate positions and maneuvers for suspected murmurs.','Complete relevant peripheral vascular, respiratory and abdominal examination.','Summarize the cardiovascular findings and likely clinical syndrome.']},
{name:'Respiratory Examination',items:['Position patient comfortably and expose the chest appropriately.','Assess respiratory distress, posture, respiratory rate and oxygen requirement.','Inspect hands for clubbing, cyanosis and tremor.','Inspect chest shape, symmetry, scars and respiratory movements.','Assess tracheal position and chest expansion.','Assess tactile vocal fremitus when indicated.','Percuss corresponding lung fields systematically.','Auscultate breath sounds and identify wheeze, crackles, bronchial breathing or other added sounds.','Assess vocal resonance when indicated.','Complete relevant cardiovascular and peripheral examination and summarize.']},
{name:'Abdominal Examination',items:['Position supine, ensure privacy and expose the abdomen appropriately.','Inspect contour, distension, scars, striae, veins, umbilicus, hernias and visible peristalsis.','Palpate lightly in all quadrants for tenderness, guarding and rigidity.','Deeply palpate for masses and organomegaly.','Assess liver, spleen, kidneys and other relevant masses.','Percuss liver span, splenic area and shifting dullness when indicated.','Auscultate bowel sounds and vascular bruits when relevant.','Examine hernial orifices or rectum only when clinically indicated and consented.','Complete relevant systemic examination and present findings systematically.']},
{name:'CNS Examination',items:['Assess consciousness, orientation, speech and higher mental functions as indicated.','Examine cranial nerves systematically or selectively according to the clinical problem.','Assess motor system: bulk, tone, power and involuntary movements.','Assess deep tendon reflexes and plantar responses.','Assess sensation including touch, pain, temperature, vibration and proprioception when indicated.','Assess coordination and cerebellar function.','Assess gait and station when safe.','Check meningeal signs when clinically indicated.','Localize neurological findings and provide a concise summary.']},
{name:'Musculoskeletal Examination',items:['Inspect posture, gait, symmetry, swelling, deformity, erythema and wasting.','Palpate for warmth, tenderness, effusion and crepitus.','Assess active and passive range of movement.','Assess muscle power and functional limitation.','Perform joint-specific special tests when indicated.','Examine adjacent joints and relevant spine.','Perform distal neurovascular assessment.','Compare both sides and summarize anatomical distribution.']},
{name:'Thyroid Examination',items:['Inspect neck for swelling, asymmetry, scars and visible movement with swallowing.','Palpate thyroid for size, surface, consistency, nodules, tenderness and mobility.','Assess cervical lymph nodes.','Assess tracheal position and possible retrosternal extension when suspected.','Auscultate for thyroid bruit when clinically indicated.','Look for signs of hyperthyroidism or hypothyroidism.','Ask about and assess compressive symptoms such as dysphagia, dyspnea and voice change.','Complete relevant cardiovascular and systemic examination.']},
{name:'Obstetric Examination',items:['Confirm gestational age, explain examination, obtain consent and ensure privacy.','Assess maternal vitals, pallor, edema and signs of systemic disease.','Inspect abdomen for size, shape, scars, striae and visible fetal movements.','Measure fundal height using appropriate technique.','Palpate for uterine tone, tenderness, fetal lie and presentation using Leopold maneuvers.','Identify fetal back and auscultate fetal heart rate appropriately.','In labor, assess contractions for frequency, duration, strength and relaxation.','Perform vaginal examination only when indicated, consented and clinically appropriate.','Present maternal and fetal findings in a structured format.']},
{name:'Gynecological Examination',items:['Explain procedure, obtain consent, ensure privacy and use a chaperone according to local policy.','Inspect abdomen and palpate for tenderness or masses.','Inspect external genitalia for lesions, discharge, bleeding or prolapse.','Perform speculum examination when indicated and inspect vagina and cervix.','Perform bimanual examination when indicated: cervix, uterus and adnexa.','Take appropriate specimens according to clinical indication and local protocol.','Document findings clearly with side and site.']},
{name:'Pediatric Examination',items:['Observe the child before touching them and establish rapport.','Assess general appearance, interaction, hydration, nutrition and development.','Record age-appropriate vital signs.','Measure weight, height/length and head circumference where appropriate and assess growth.','Look for pallor, cyanosis, jaundice, clubbing, edema, rash and lymphadenopathy.','Perform focused respiratory, cardiovascular and abdominal examination.','Assess neurological and developmental status appropriate to age.','Complete focused examination and communicate findings clearly.']},
{name:'Eye Examination',items:['Assess visual acuity separately for each eye using an appropriate chart or method.','Inspect eyelids, conjunctiva, sclera and cornea.','Assess pupils for size, symmetry and light responses.','Assess extraocular movements and ocular alignment.','Assess visual fields by confrontation when indicated.','Perform fundoscopy when indicated and feasible.','Assess red reflex when relevant, especially in children.','Document laterality and abnormalities precisely.']},
{name:'ENT Examination',items:['Inspect external ear, nose, mouth and neck.','Perform otoscopy and assess tympanic membrane when appropriate.','Assess hearing with bedside methods when indicated.','Inspect nasal septum, mucosa, turbinates and discharge.','Examine lips, teeth, gums, tongue, palate, tonsils and pharynx.','Assess voice, swallowing and airway symptoms when relevant.','Palpate cervical lymph nodes and thyroid when indicated.','Complete cranial nerve examination when relevant.']},
{name:'Peripheral Vascular Examination',items:['Inspect limbs for color, ulcers, gangrene, trophic changes, edema and varicosities.','Assess temperature and capillary refill.','Palpate peripheral pulses systematically and compare sides.','Assess pulse character and relevant pulse delays.','Auscultate for arterial bruits when indicated.','Assess venous skin changes and edema.','Perform distal neurological and musculoskeletal assessment.','Document side, distribution and severity; recognize features requiring urgent assessment.']},
{name:'Breast Examination',items:['Explain, obtain consent, ensure privacy and use a chaperone according to local policy.','Inspect breasts with arms relaxed and in appropriate positions.','Look for asymmetry, skin changes, nipple retraction and discharge.','Palpate each breast systematically for masses and tenderness.','Characterize any mass by site, size, consistency, mobility and fixation.','Palpate axillary and supraclavicular lymph nodes.','Document laterality and findings clearly.']},
{name:'Skin Examination',items:['Inspect skin systematically for color, lesions, distribution and morphology.','Describe primary lesions by type, size, shape, border and surface.','Assess secondary changes such as scale, crust, erosion, ulceration and scarring.','Palpate lesions when relevant for warmth, tenderness, induration and depth.','Examine mucous membranes, nails and hair when indicated.','Assess distribution and symmetry and check relevant lymph nodes.','Document lesions precisely and obtain photographs only with appropriate consent and policy.']}
];
'''
          p.write_text(s+extra)
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clinical-content-v1.js
          git commit -m 'Expand physical examination reference'
          git push
